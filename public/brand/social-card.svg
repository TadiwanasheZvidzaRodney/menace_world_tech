<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" role="img" aria-labelledby="sc-title sc-desc">
  <title id="sc-title">Menace World Tech</title>
  <desc id="sc-desc">Taking your business to another dimension.</desc>

  <defs>
    <linearGradient id="sc-grad" x1="90" y1="560" x2="1100" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7c21f5"/>
      <stop offset="50%"  stop-color="#f20ecf"/>
      <stop offset="100%" stop-color="#12ddf3"/>
    </linearGradient>
    <linearGradient id="sc-text-grad" x1="88" y1="220" x2="700" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#f7f5ff"/>
      <stop offset="60%" stop-color="#12ddf3"/>
      <stop offset="100%" stop-color="#f20ecf"/>
    </linearGradient>
    <pattern id="sc-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#f7f5ff" stroke-opacity="0.045"/>
    </pattern>
    <!-- Glow filters -->
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text-glow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#05030a"/>
  <rect width="1200" height="630" fill="url(#sc-grid)"/>

  <!-- Ambient orbs -->
  <ellipse cx="200"  cy="200" rx="340" ry="280" fill="#7c21f5" opacity="0.12"/>
  <ellipse cx="1050" cy="440" rx="280" ry="240" fill="#f20ecf" opacity="0.10"/>
  <ellipse cx="700"  cy="80"  rx="220" ry="180" fill="#12ddf3" opacity="0.08"/>

  <!-- Bottom gradient line -->
  <rect x="88" y="560" width="560" height="5" rx="2.5" fill="url(#sc-grad)" opacity="0.9"/>

  <!-- Logo image (top-left) -->
  <image
    href="/logo.webp"
    x="88"
    y="68"
    width="110"
    height="110"
    preserveAspectRatio="xMidYMid meet"
    filter="url(#logo-glow)"
  />

  <!-- Site name next to logo -->
  <text x="216" y="108" fill="#f7f5ff" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" letter-spacing="3">MENACE WORLD</text>
  <text x="216" y="138" fill="#12ddf3" font-family="Arial Black, sans-serif" font-size="16" font-weight="800" letter-spacing="6">TECH</text>

  <!-- Divider -->
  <line x1="88" y1="204" x2="500" y2="204" stroke="#f7f5ff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Headline -->
  <text x="88" y="270" font-family="Arial Black, sans-serif" font-size="62" font-weight="900" fill="url(#sc-text-grad)" filter="url(#text-glow)">Taking your business</text>
  <text x="88" y="348" font-family="Arial Black, sans-serif" font-size="62" font-weight="900" fill="url(#sc-text-grad)" filter="url(#text-glow)">to another dimension.</text>

  <!-- Tagline -->
  <text x="88" y="418" fill="#aaa3ba" font-family="Arial, sans-serif" font-size="24" font-weight="400">Zimbabwe's growth partner for small business.</text>

  <!-- Services strip -->
  <text x="88" y="492" fill="#aaa3ba" font-family="Arial, sans-serif" font-size="18" letter-spacing="1">Strategy · Content · Paid Media · Web · Automation · Reporting</text>

  <!-- Right-side decorative mark (subtle) -->
  <g opacity="0.18" transform="translate(940, 160)">
    <path d="M18 128V40h22l40 44 40-44h22v88h-25V78l-37 40-37-40v50H18Z" fill="url(#sc-grad)"/>
    <path d="m111 16 32 32h-19v31h-24V48H81l30-32Z" fill="#f7f5ff" opacity="0.6"/>
  </g>
</svg>
